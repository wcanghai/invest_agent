[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-market-investment-tools"
version = "1.0.0"
description = "可配置的多市场行情日报、财经新闻和通达信历史数据工具"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "akshare>=1.17",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
market-report = "market_report.cli:main"
market-cache = "market_report.cache_cli:main"
finance-news = "finance_news.cli:main"
tdx-history = "tdx_history.cli:main"

[tool.setuptools.packages.find]
include = ["finance_news*", "market_report*", "tdx_history*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
